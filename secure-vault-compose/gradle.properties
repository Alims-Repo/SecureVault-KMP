# Per-module overrides for vanniktech-maven-publish. Inherits GROUP and
# VERSION_NAME from the root gradle.properties; only the artifactId needs
# to differ from the core ':secure-vault' module.
#
# secure-vault-compose ships on its own SemVer track because Compose
# Multiplatform releases are themselves frequent and decoupled from the
# core library's cadence. Bump independently.

POM_ARTIFACT_ID=secure-vault-compose
VERSION_NAME=0.1.0

