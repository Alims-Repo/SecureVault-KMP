name: docs

# Builds the multi-module Dokka HTML site and deploys it (together with the
# hand-written landing page under docs/) to GitHub Pages.
#
# Pages site layout:
#   /                -> docs/index.html        (landing)
#   /api/            -> Dokka aggregate index
#   /api/secure-vault/...
#   /api/secure-vault-compose/...

on:
  push:
    branches: [main]
  workflow_dispatch:

# A single concurrent deployment of Pages at a time.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Dokka HTML
        run: ./gradlew :dokkaGenerate --no-daemon --no-configuration-cache

      - name: Stage Pages site
        run: |
          mkdir -p _site
          # Copy the hand-written landing page first, then drop the Dokka
          # output under /api/. Order matters: we want index.html to come
          # from docs/, not from Dokka.
          cp -R docs/. _site/
          # Dokka writes into docs/api by the root build.gradle.kts; ensure
          # it exists even if the task short-circuits.
          mkdir -p _site/api
          if [ -d docs/api ]; then cp -R docs/api/. _site/api/; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

